<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartoon Studio">
<title>KI Cartoon Studio</title>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#fff4e0; color:#222;
         padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  h1 { text-align:center; margin:24px 0 8px; font-size:28px; }
  p.sub { text-align:center; margin:0 0 20px; color:#666; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  button { border:none; border-radius:22px; padding:26px 10px; font-size:18px;
           font-weight:700; color:#fff; }
  .neu { grid-column:1 / 3; background:#ff6b35; font-size:22px; }
  .b1 { background:#3a86ff; } .b2 { background:#8338ec; }
  .b3 { background:#06a77d; } .b4 { background:#e63946; }
  .b5 { background:#555; }
</style>
</head>
<body>
  <h1>🎬 KI Cartoon Studio</h1>
  <p class="sub">Dein eigenes Zeichentrickstudio</p>
  <div class="grid">
    <button class="neu" onclick="alert('Kommt bald!')">➕ Neuen Film erstellen</button>
    <button class="b1" onclick="alert('Kommt bald!')">🎞️ Meine Filme</button>
    <button class="b2" onclick="alert('Kommt bald!')">🐶 Meine Figuren</button>
    <button class="b3" onclick="alert('Kommt bald!')">📖 Meine Geschichten</button>
    <button class="b4" onclick="alert('Kommt bald!')">⭐ Vorlagen</button>
    <button class="b5" onclick="alert('Kommt bald!')">⚙️ Einstellungen</button>
  </div>
</body>
</html>
