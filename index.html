<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartoon Studio">
<title>KI Cartoon Studio</title>
<style>
body{margin:0;font-family:-apple-system,sans-serif;background:#fff4e0;color:#222;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
h1{text-align:center;margin:24px 0 8px;font-size:28px}
h2{text-align:center;margin:16px 0}
h3{margin:16px 0 8px;font-size:17px}
p.sub{text-align:center;margin:0 0 20px;color:#666}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{border:none;border-radius:22px;padding:22px 10px;font-size:18px;font-weight:700;color:#fff;background:#555}
.neu{grid-column:1/3;background:#ff6b35;font-size:22px}
.b1{background:#3a86ff}.b2{background:#8338ec}.b3{background:#06a77d}.b4{background:#e63946}
.zurueck{background:#999;padding:12px 18px;font-size:16px;border-radius:14px}
.gross{width:100%;margin-top:14px;background:#ff6b35}
.karte{background:#fff;border-radius:20px;padding:10px;margin:12px 0;display:flex;align-items:center;gap:14px}
.karte svg{width:90px;height:108px}
.karte b{flex:1;font-size:20px}
.karte small{font-weight:400;color:#666;font-size:14px}
.loesch{background:#e63946;padding:10px 14px;font-size:14px;border-radius:12px}
.vorschau{position:sticky;top:8px;z-index:5;background:#fff;border-radius:22px;margin:8px auto;width:120px;padding:6px;box-shadow:0 4px 14px #0003}
.vorschau svg{width:100%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border:3px solid #ddd;border-radius:16px;padding:9px 14px;font-size:16px}
.chip.an{border-color:#ff6b35;background:#ffe3d6;font-weight:700}
.dot{width:42px;height:42px;border-radius:50%;border:3px solid #ccc;box-sizing:border-box}
.dot.an{border:5px solid #ff6b35}
.szene{background:#fff;border-radius:20px;padding:12px;margin:14px 0}
.szene label{display:block;font-weight:700;margin:10px 0 4px}
textarea,select{width:100%;box-sizing:border-box;font-size:17px;padding:10px;border-radius:12px;border:3px solid #ddd;font-family:inherit;background:#fff}
.zeile{position:relative;margin-top:10px}
.zeile select{width:calc(100% - 64px);margin-bottom:6px}
.zeile .loesch{position:absolute;right:0;top:0;padding:8px 14px}
.klein{margin-top:10px;padding:10px 16px;font-size:15px;border-radius:14px;background:#06a77d}
.gdauer{background:#fff;border-radius:14px;padding:10px 14px;margin:12px 0;font-weight:700}
input{width:100%;box-sizing:border-box;font-size:20px;padding:14px;border-radius:14px;border:3px solid #ddd}
</style></head><body>
<div id="app"></div>
<script src="daten.js?v=4"></script>
<script src="svg.js?v=4"></script>
<script src="svg_tier.js?v=4"></script>
<script src="gen.js?v=4"></script>
<script src="geschichten.js?v=4"></script>
<script src="gedit.js?v=4"></script>
<script src="app.js?v=4"></script>
</body></html>
