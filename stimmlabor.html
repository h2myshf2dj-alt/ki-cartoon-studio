<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimmlabor</title>
<style>
body{font-family:-apple-system,sans-serif;background:#fff4e0;padding:16px;margin:0}
h2{text-align:center}
button{border:none;border-radius:18px;padding:14px 12px;font-size:17px;font-weight:700;color:#fff;background:#555;margin:4px}
.gross{display:block;width:100%;background:#ff6b35;font-size:20px;padding:20px;margin:12px 0;border-radius:22px}
.reg{background:#fff;border-radius:14px;padding:8px 12px;margin:8px 0}
.reg label{display:flex;justify-content:space-between;font-weight:700}
.reg input{width:100%}
select{width:100%;font-size:17px;padding:10px;border-radius:12px;border:3px solid #ddd;background:#fff}
#log{background:#fff;border-radius:14px;padding:12px;font-size:16px;line-height:1.5;white-space:pre-wrap}
</style></head><body>
<h2>🎛 Stimmlabor</h2>
<select id="vs">
<option value="de_DE-thorsten_emotional-medium">Thorsten emotional</option>
<option value="de_DE-thorsten-medium">Thorsten normal</option>
<option value="de_DE-thorsten-high">Thorsten high</option>
</select>
<div>
<button style="background:#3a86ff" onclick="pre('Mann')">Mann</button>
<button style="background:#8338ec" onclick="pre('Frau')">Frau</button>
<button style="background:#06a77d" onclick="pre('Kind')">Kind</button>
<button style="background:#b5651d" onclick="pre('Opa')">Opa</button>
<button style="background:#e63946" onclick="pre('Monster')">Monster</button>
</div>
<div id="regler"></div>
<button class="gross" onclick="los()">▶ Anhören</button>
<div>
<button style="background:#3a86ff" onclick="speichern('Mann')">💾 Als Mann</button>
<button style="background:#8338ec" onclick="speichern('Frau')">💾 Als Frau</button>
<button style="background:#06a77d" onclick="speichern('Kind')">💾 Als Kind</button>
<button onclick="zurueck()">↩ Standard</button>
</div>
<div id="log">Wähle eine Stimme, tippe auf Mann / Frau / Kind … und dann auf Anhören. Mit den Reglern kannst du die Stimme verändern. Tippe danach wieder auf Anhören.</div>
<script src="stimme.js?v=2"></script>
<script>
var T=null,RAW={},AUD=new Audio(),L=document.getElementById('log');
var TXT='Hallo! Ich bin eine Stimme aus deinem Cartoon Studio. Was für ein schöner Tag! Wollen wir zusammen ein Abenteuer erleben?';
var DEF=[['st','Tonhöhe (Halbtöne)',-10,10,0.5],['tempo','Tempo',0.7,1.3,0.05],['bass','Bass (dB)',-12,12,1],['mid','Mitten (dB)',-12,12,1],['hoch','Höhen (dB)',-12,12,1]];
var PRE={Mann:[0,1,0,0,0],Frau:[4.5,1,-4,1,3],Kind:[7,1.05,-6,2,4],Opa:[-2,0.9,3,0,-3],Monster:[-6,0.85,6,-2,-4]};
var V={st:0,tempo:1,bass:0,mid:0,hoch:0};
function p(s){L.textContent=s}
function bauen(){
  var h='';
  DEF.forEach(function(d){h+='<div class="reg"><label><span>'+d[1]+'</span><span id="w_'+d[0]+'">'+V[d[0]]+'</span></label><input type="range" min="'+d[2]+'" max="'+d[3]+'" step="'+d[4]+'" value="'+V[d[0]]+'" oninput="V.'+d[0]+'=+this.value;document.getElementById(\'w_'+d[0]+'\').textContent=this.value"></div>'});
  document.getElementById('regler').innerHTML=h;
}
function pre(n){var a=PRE[n];DEF.forEach(function(d,i){V[d[0]]=a[i]});bauen();p('Voreinstellung '+n+' gewählt. Tippe auf Anhören.')}
function speichern(n){
  try{var a=JSON.parse(localStorage.getItem('stimmen')||'{}');a[n]={st:V.st,tempo:V.tempo,bass:V.bass,mid:V.mid,hoch:V.hoch};localStorage.setItem('stimmen',JSON.stringify(a));p('💾 Gespeichert für „'+n+'“. Der Film benutzt diese Einstellung ab sofort für alle '+n+'-Figuren.\n(Wichtig: Öffne danach den Film in derselben App/Safari, in der du gespeichert hast.)')}catch(e){p('❌ Speichern nicht möglich: '+e.message)}
}
function zurueck(){try{localStorage.removeItem('stimmen');p('Zurückgesetzt auf die Standard-Stimmen.')}catch(e){}}
function freischalten(){try{AUD.src=URL.createObjectURL(Stimme.wav(new Float32Array(2205),22050));AUD.play().catch(function(){})}catch(e){}}
async function holen(id){
  if(RAW[id])return RAW[id];
  if(!T)T=await import('https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/+esm');
  var w=await T.predict({text:TXT,voiceId:id},function(x){if(x&&x.total)p('Stimme wird geladen: '+Math.round(x.loaded*100/x.total)+' %')});
  return RAW[id]=await Stimme.dekodiere(w);
}
async function los(){
  freischalten();
  try{
    var id=document.getElementById('vs').value;
    p('Stimme wird geholt … (beim ersten Mal bis 1 Minute)');
    var r=await holen(id);
    p('Stimme wird verändert …');
    await new Promise(function(ok){setTimeout(ok,30)});
    var z=await Stimme.verarbeiten(r.x,r.rate,V);
    AUD.src=URL.createObjectURL(Stimme.wav(z,r.rate));
    p('✅ Ton läuft.\nEinstellung: Tonhöhe '+V.st+', Tempo '+V.tempo+', Bass '+V.bass+', Mitten '+V.mid+', Höhen '+V.hoch);
    await AUD.play();
  }catch(e){p('❌ Fehler: '+(e&&e.message?e.message:e))}
}
bauen();
</script>
</body></html>
