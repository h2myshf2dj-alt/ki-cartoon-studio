<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimmen-Test Supertonic</title>
<style>
body{font-family:-apple-system,sans-serif;background:#fff4e0;padding:16px;margin:0;color:#222}
h2{text-align:center;margin:8px 0}
button{display:block;width:100%;border:none;border-radius:20px;padding:20px 10px;font-size:18px;font-weight:700;color:#fff;background:#ff6b35;margin:10px 0}
button.m{background:#3a86ff}button.f{background:#8338ec}button.k{background:#06a77d;padding:12px}
#log{background:#fff;border-radius:14px;padding:12px;font-size:16px;line-height:1.5;white-space:pre-wrap;min-height:60px}
label{display:block;margin:10px 0;font-size:16px}
textarea{width:100%;box-sizing:border-box;font-size:17px;padding:10px;border-radius:12px;border:3px solid #ddd;font-family:inherit}
</style></head><body>
<h2>🎤 Stimmen-Test (Supertonic)</h2>
<button onclick="laden()">1. Stimme laden (einmalig, großer Download – WLAN!)</button>
<label><input type="checkbox" id="kompat"> Kompatibel-Modus (langsamer, aber sicherer). Nur ankreuzen, wenn es sonst einen Fehler gibt.</label>
<textarea id="txt" rows="3">Hallo! Ich bin eine Stimme aus deinem Cartoon Studio. Was für ein schöner Tag, wir schaffen das gemeinsam!</textarea>
<button class="m" onclick="los('M1')">Mann 1 (M1) abspielen</button>
<button class="m" onclick="los('M2')">Mann 2 (M2) abspielen</button>
<button class="m" onclick="los('M3')">Mann 3 (M3) abspielen</button>
<button class="f" onclick="los('F1')">Frau 1 (F1) abspielen</button>
<button class="f" onclick="los('F2')">Frau 2 (F2) abspielen</button>
<button class="f" onclick="los('F3')">Frau 3 (F3) abspielen</button>
<button class="k" onclick="mehr()">Weitere Stimmen anzeigen (M4, M5, F4, F5)</button>
<div id="mehr"></div>
<div id="log">Tippe zuerst auf „Stimme laden“.</div>
<script src="supertonic.js?v=1"></script>
<script>
var L=document.getElementById('log'),A=new Audio(),SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=';
function p(s){L.textContent=s}
function frei(){try{A.src=SIL;var x=A.play();if(x&&x.catch)x.catch(function(){})}catch(e){}}
function wav(a,sr){var n=a.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);function w(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(var i=0;i<n;i++){var s=Math.max(-1,Math.min(1,a[i]));v.setInt16(44+i*2,s*32767,true)}return new Blob([b],{type:'audio/wav'})}
async function laden(){
  frei();var t0=Date.now();
  try{await Super.laden(function(t){p('⏳ '+t)},document.getElementById('kompat').checked);
    p('✅ Stimme geladen nach '+Math.round((Date.now()-t0)/1000)+' s. Technik: '+Super.backend+'. Jetzt eine Stimme antippen.')}
  catch(e){p('❌ Fehler beim Laden: '+(e&&e.message?e.message:e)+'\n\nTipp: Kompatibel-Modus ankreuzen und nochmal laden.')}
}
async function los(id){
  frei();var t0=Date.now();
  try{
    if(!Super.ok){p('⏳ Stimme wird zuerst geladen …');await Super.laden(function(t){p('⏳ '+t)},document.getElementById('kompat').checked)}
    p('⏳ Stimme '+id+' spricht … (Rechnen)');
    var r=await Super.sprich(document.getElementById('txt').value,id);
    var s=Math.round((Date.now()-t0)/100)/10;
    A.src=URL.createObjectURL(wav(r.x,r.rate));
    p('✅ '+id+': '+Math.round(r.x.length/r.rate*10)/10+' s Sprache, in '+s+' s berechnet ('+Super.backend+'). Ton läuft …');
    await A.play();
  }catch(e){p('❌ Fehler: '+(e&&e.message?e.message:e))}
}
function mehr(){var h='';['M4','M5','F4','F5'].forEach(function(n){h+='<button class="'+(n[0]=='M'?'m':'f')+'" onclick="los(\''+n+'\')">'+(n[0]=='M'?'Mann':'Frau')+' '+n[1]+' ('+n+') abspielen</button>'});document.getElementById('mehr').innerHTML=h}
</script>
</body></html>
