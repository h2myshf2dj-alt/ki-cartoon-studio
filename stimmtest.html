<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimmen-Test</title>
<style>
body{font-family:-apple-system,sans-serif;background:#fff4e0;padding:16px;margin:0}
h2{text-align:center}
button{display:block;width:100%;border:none;border-radius:22px;padding:18px 10px;font-size:18px;font-weight:700;color:#fff;background:#ff6b35;margin:10px 0}
#log{background:#fff;border-radius:14px;padding:12px;font-size:16px;line-height:1.5;white-space:pre-wrap}
</style></head><body>
<h2>🎤 Stimmen-Test 7</h2>
<button onclick="los('de_DE-mls-medium')">MLS (mehrere Sprecher)</button>
<button style="background:#3a86ff" onclick="los('de_DE-thorsten_emotional-medium')">Thorsten emotional</button>
<button style="background:#555" onclick="los('de_DE-thorsten-high')">Thorsten high</button>
<div id="log">Lade die Seite vor jedem Test neu (nach unten ziehen). Die Stimme wird beim ersten Mal geladen, das kann etwas dauern.</div>
<script>
var T=null,L=document.getElementById('log'),AUD=new Audio();
var TXT='Hallo! Ich bin eine Stimme aus deinem Cartoon Studio. Was für ein schöner Tag!';
function p(s){L.textContent=s}
function stille(){
  var n=2205,o=new DataView(new ArrayBuffer(44+n*2));
  function t(a,s){for(var i=0;i<s.length;i++)o.setUint8(a+i,s.charCodeAt(i))}
  t(0,'RIFF');o.setUint32(4,36+n*2,true);t(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);
  o.setUint32(24,22050,true);o.setUint32(28,44100,true);o.setUint16(32,2,true);o.setUint16(34,16,true);t(36,'data');o.setUint32(40,n*2,true);
  return new Blob([o],{type:'audio/wav'});
}
async function los(id){
  try{
    try{AUD.src=URL.createObjectURL(stille());AUD.play().catch(function(){})}catch(e){}
    p('Angefragt: '+id+'\nWird geladen und erzeugt …');
    if(!T)T=await import('https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/+esm');
    var t0=Date.now();
    var w=await T.predict({text:TXT,voiceId:id});
    AUD.src=URL.createObjectURL(w);
    p('✅ '+id+' erzeugt ('+Math.round((Date.now()-t0)/1000)+' s). Ton läuft …');
    await AUD.play();
  }catch(e){p('Angefragt: '+id+'\n❌ Fehler: '+(e&&e.message?e.message:e))}
}
</script>
</body></html>
