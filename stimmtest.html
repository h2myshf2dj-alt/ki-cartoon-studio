<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimmen-Test</title>
<style>
body{font-family:-apple-system,sans-serif;background:#fff4e0;padding:16px;margin:0}
h2{text-align:center}
button{display:block;width:100%;border:none;border-radius:22px;padding:22px 10px;font-size:18px;font-weight:700;color:#fff;background:#ff6b35;margin:12px 0}
#log{background:#fff;border-radius:14px;padding:12px;font-size:16px;line-height:1.5;white-space:pre-wrap}
</style></head><body>
<h2>🎤 Stimmen-Test</h2>
<button onclick="los('de_DE-thorsten-medium')">Männerstimme testen (Thorsten)</button>
<button style="background:#8338ec" onclick="los('de_DE-ramona-low')">Frauenstimme testen (Ramona)</button>
<div id="log">Tippe auf einen Knopf. Beim ersten Mal wird die Stimme einmalig geladen (bis ca. 60 MB, am besten im WLAN).</div>
<script>
var T=null,L=document.getElementById('log');
function p(s){L.textContent=s}
async function los(id){
  try{
    var t0=Date.now();
    p('1/3 Programm wird geladen …');
    if(!T)T=await import('https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/+esm');
    p('2/3 Stimme wird geladen und gesprochen … (kann 1 Minute dauern)');
    var w=await T.predict({text:'Hallo! Ich bin eine Stimme aus deinem Cartoon Studio. Was für ein schöner Tag!',voiceId:id},function(x){
      if(x&&x.total)p('2/3 Stimme wird geladen: '+Math.round(x.loaded*100/x.total)+' %');
    });
    var a=new Audio();a.src=URL.createObjectURL(w);
    p('3/3 Fertig nach '+Math.round((Date.now()-t0)/1000)+' Sekunden. Größe '+Math.round(w.size/1024)+' KB. Ton läuft …');
    await a.play();
  }catch(e){p('❌ Fehler: '+(e&&e.message?e.message:e))}
}
</script>
</body></html>
