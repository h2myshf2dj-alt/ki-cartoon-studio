<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimmen-Test</title>
<style>
body{font-family:-apple-system,sans-serif;background:#fff4e0;padding:16px;margin:0}
h2{text-align:center}
button{display:block;width:100%;border:none;border-radius:22px;padding:16px 10px;font-size:18px;font-weight:700;color:#fff;background:#ff6b35;margin:9px 0}
#log{background:#fff;border-radius:14px;padding:12px;font-size:16px;line-height:1.5;white-space:pre-wrap}
#sp button{display:inline-block;width:auto;padding:12px 16px;margin:5px;background:#8338ec}
</style></head><body>
<h2>🎤 Stimmen-Test 6</h2>
<button onclick="laden()">1) Sprach-Technik laden</button>
<div id="sp"></div>
<div id="log">Tippe auf „Sprach-Technik laden“. Das dauert beim ersten Mal bis 1 Minute (am besten im WLAN).</div>
<script>
var BASE='https://huggingface.co/spaces/k2-fsa/web-assembly-tts-sherpa-onnx-de/resolve/main/';
var TTS=null,L=document.getElementById('log'),AUD=new Audio(),geladen=false;
var TXT='Hallo! Ich bin eine Stimme aus deinem Cartoon Studio. Was für ein schöner Tag!';
function p(s){L.textContent=s}
function wav(x,rate){
  var n=x.length,o=new DataView(new ArrayBuffer(44+n*2));
  function t(a,s){for(var i=0;i<s.length;i++)o.setUint8(a+i,s.charCodeAt(i))}
  t(0,'RIFF');o.setUint32(4,36+n*2,true);t(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);
  o.setUint32(24,rate,true);o.setUint32(28,rate*2,true);o.setUint16(32,2,true);o.setUint16(34,16,true);t(36,'data');o.setUint32(40,n*2,true);
  for(var i=0;i<n;i++){var v=Math.max(-1,Math.min(1,x[i]));o.setInt16(44+i*2,v<0?v*32768:v*32767,true)}
  return new Blob([o],{type:'audio/wav'});
}
function freischalten(){try{AUD.src=URL.createObjectURL(wav(new Float32Array(2205),22050));AUD.play().catch(function(){})}catch(e){}}
function skript(u){return new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=function(){no(new Error('Datei nicht ladbar: '+u))};document.head.appendChild(s)})}
async function laden(){
  freischalten();
  try{
    if(geladen){p('Schon geladen.');return}
    p('1/3 Skripte werden geladen …');
    await skript(BASE+'sherpa-onnx-tts.js');
    await new Promise(function(ok,no){
      window.Module={locateFile:function(f){return BASE+f},setStatus:function(s){if(s)p('2/3 Stimme wird geladen … '+s)},
        onRuntimeInitialized:function(){try{TTS=createOfflineTts(Module);ok()}catch(e){no(e)}},
        onAbort:function(w){no(new Error('Abbruch: '+w))}};
      skript(BASE+'sherpa-onnx-wasm-main-tts.js').catch(no);
    });
    geladen=true;
    var n=TTS.numSpeakers||1,h='';
    for(var i=0;i<Math.min(n,16);i++)h+='<button onclick="sprich('+i+')">Sprecher '+i+'</button>';
    document.getElementById('sp').innerHTML=h;
    p('✅ 3/3 Geladen. Stimmen: '+n+' Sprecher, Abtastrate '+TTS.sampleRate+'.\nTippe auf einen Sprecher.');
  }catch(e){p('❌ Fehler: '+(e&&e.message?e.message:e))}
}
function sprich(i){
  freischalten();
  try{
    p('Sprecher '+i+' wird erzeugt …');
    setTimeout(function(){
      try{
        var t0=Date.now(),a=TTS.generate({text:TXT,sid:i,speed:1.0});
        AUD.src=URL.createObjectURL(wav(a.samples,a.sampleRate));
        p('✅ Sprecher '+i+' – erzeugt in '+(Date.now()-t0)+' ms. Ton läuft …');
        AUD.play().catch(function(e){p('❌ Abspielen blockiert: '+e.message)});
      }catch(e){p('❌ Fehler: '+(e&&e.message?e.message:e))}
    },50);
  }catch(e){p('❌ Fehler: '+(e&&e.message?e.message:e))}
}
</script>
</body></html>
