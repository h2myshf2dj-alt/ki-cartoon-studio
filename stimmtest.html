<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimmen-Test</title>
<style>
body{font-family:-apple-system,sans-serif;background:#fff4e0;padding:16px;margin:0}
h2{text-align:center}
button{display:block;width:100%;border:none;border-radius:22px;padding:18px 10px;font-size:18px;font-weight:700;color:#fff;background:#ff6b35;margin:10px 0}
#log{background:#fff;border-radius:14px;padding:12px;font-size:16px;line-height:1.5;white-space:pre-wrap}
</style></head><body>
<h2>🎤 Stimmen-Test 3</h2>
<button onclick="ton(1)">Mann (Thorsten normal)</button>
<button style="background:#8338ec" onclick="ton(1.22)">Frau (höher)</button>
<button style="background:#06a77d" onclick="ton(1.45)">Kind (noch höher)</button>
<button style="background:#e63946" onclick="kerstin()">Kerstin mit anderer Bibliothek</button>
<div id="log">Tippe auf einen Knopf. Beim ersten Mal wird Thorsten geladen, danach geht es schneller.</div>
<script>
var T=null,W=null,L=document.getElementById('log');
function p(s){L.textContent=s}
function spiele(w,r){
  var a=new Audio();a.src=URL.createObjectURL(w);
  a.preservesPitch=false;a.webkitPreservesPitch=false;a.mozPreservesPitch=false;
  a.playbackRate=r;return a.play();
}
async function ton(r){
  try{
    if(!W){
      p('Thorsten wird geladen und erzeugt … (beim ersten Mal bis 1 Minute)');
      if(!T)T=await import('https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/+esm');
      W=await T.predict({text:'Hallo! Ich bin eine Stimme aus deinem Cartoon Studio. Was für ein schöner Tag!',voiceId:'de_DE-thorsten-medium'});
    }
    p('Ton läuft, Tonlage-Faktor '+r+' …');
    await spiele(W,r);
  }catch(e){p('❌ Fehler: '+(e&&e.message?e.message:e))}
}
async function kerstin(){
  try{
    p('Andere Bibliothek wird geladen …');
    var R=await import('https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm');
    p('Kerstin wird geladen und erzeugt …');
    var w=await R.predict({text:'Hallo! Ich bin Kerstin aus deinem Cartoon Studio.',voiceId:'de_DE-kerstin-low'});
    p('✅ Kerstin klappt! Ton läuft …');
    await spiele(w,1);
  }catch(e){p('❌ Kerstin Fehler: '+(e&&e.message?e.message:e))}
}
</script>
</body></html>
